# One-tap deploy to Render (free). This gives Ex-Files a public URL with open
# internet, so it can actually reach Africa's Talking and place the goat calls.
#
# Secrets (API key) are entered in the Render dashboard, never in this repo.
services:
  - type: web
    name: ex-files
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: AT_USERNAME
        value: maxmassv
      - key: AT_API_KEY
        sync: false          # you paste this in the Render dashboard (kept secret)
      - key: AT_VOICE_NUMBER
        value: "+256200600600"
      - key: GOAT_AUDIO_URL
        value: "https://heartmatch.nlis.farm/"   # goat sound played on the call
